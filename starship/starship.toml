# Starship Prompt - Pro, Universal & Safe
"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 3000
add_newline = true

# --- Pro 2-line Prompt ---
# Contexto arriba (OS, usuario, host, ambiente crítico si aplica, directorio, git, runtimes, duración comando)
# Símbolo de acción abajo (❯ / ❮), bien visible
format = """
[┌─](bold fg:#8aadf4) $os $username $hostname ${env_var.STARSHIP_DISTRO} $directory $git_branch $git_status $python $nodejs $cmd_duration
[└─](bold fg:#a6da95)$character
"""

# ---------- OS Detection Universal ----------
[os]
disabled = false
format = "[$symbol]($style)"
style = "bold white"

[os.symbols]
Windows = "Win "
Ubuntu  = " "
Debian  = " "
Arch    = " "
CentOS  = " "
Fedora  = " "
Alpine  = " "
Redhat  = " "
Linux   = " "
Macos   = " "
Unknown = " "

# ---------- Usuario / Host / Alerta Crítica / Directorio ----------
[username]
show_always = true
style_user = "bold fg:#8aadf4"
style_root = "bold fg:#ed8796"
format = "[$user]($style)"

[hostname]
ssh_only = false
format = "at [$hostname]($style)"
style = "bold dimmed white"

# Alerta especial si STARSHIP_DISTRO="prod" (candado rojo)
[env_var.STARSHIP_DISTRO]
format = "[$symbol]($style)"
symbol = " "
style = "bold fg:#ed8796"
default = ""

[directory]
truncation_length = 4
truncation_symbol = "…/"
style = "bold fg:#a6da95"
read_only = ""
format = "in [$path]($style)"

# ---------- Prompt Char / Vim mode ----------
[character]
success_symbol = "[❯](bold fg:#a6da95)"
error_symbol   = "[❯](bold fg:#ed8796)"
vimcmd_symbol  = "[❮](bold fg:#f5a97f)"

# ---------- Git ----------
[git_branch]
symbol = " "
style = "bold fg:#c6a0f6"
format = "on [$symbol$branch]($style)"

[git_status]
style = "bold fg:#ed8796"
format = '([$all_status$ahead_behind]($style) )'
ignore_submodules = true
stashed = ""
modified = "[!](bold fg:#f5a97f)"
untracked = "[?](bold fg:#eed49f)"
deleted = "[✘](bold fg:#ed8796)"
renamed = "[»](bold fg:#f5a97f)"

# ---------- Python (con soporte uv cross-platform) ----------
[python]
python_binary = ["uv run python", "uv run python3", "python3", "python"]
detect_files = ["uv.lock", "pyproject.toml", ".python-version", "requirements.txt", "Pipfile"]
symbol = " "
style = "bold fg:#eed49f"
format = "via [$symbol$version]($style)"

# ---------- NodeJS ----------
[nodejs]
symbol = " "
style = "bold fg:#a6da95"
format = "via [$symbol$version]($style)"

# ---------- Duración de comando ----------
[cmd_duration]
min_time = 1000
format = "[⏱ $duration]($style)"
style = "bold fg:#eed49f"
